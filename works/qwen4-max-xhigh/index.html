<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GARGANTUA · 卡冈图雅 — 黑洞实时预览</title>
<meta name="description" content="基于 WebGL2 史瓦西测地线光线追踪的《星际穿越》卡冈图雅黑洞实时渲染器">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070c'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='4' fill='none' stroke='%23e8a45c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<!-- 加载遮罩 -->
<div id="loading">
  <div class="load-ring"></div>
  <div class="load-title">GARGANTUA</div>
  <div class="load-sub" id="loadMsg">正在编译着色器与生成星空…</div>
</div>

<!-- 致命错误提示 -->
<div id="fatal" hidden>
  <div class="fatal-box">
    <h2>无法启动渲染器</h2>
    <p id="fatalMsg"></p>
    <p class="fatal-tip">请使用较新版本的 Chrome / Edge / Firefox / Safari（需支持 WebGL2），并确认硬件加速已开启。</p>
  </div>
</div>

<!-- 标题 -->
<header id="brand">
  <h1>GARGANTUA</h1>
  <p>卡冈图雅 · 史瓦西黑洞 · 实时测地线光线追踪</p>
</header>

<!-- 侧边栏开关 -->
<button id="panelToggle" title="参数面板 (P)" aria-label="切换参数面板">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="#0a0d14"/>
    <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.4" fill="#0a0d14"/>
    <line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2.4" fill="#0a0d14"/>
  </svg>
</button>

<!-- 参数侧边栏 -->
<aside id="panel">
  <div class="panel-head">
    <span class="panel-title">观测参数</span>
    <span class="panel-sub">PARAMETERS</span>
  </div>
  <div class="presets" id="presets"></div>
  <div id="panelBody"></div>
  <div class="panel-foot">
    <button id="btnReset" class="btn">重置视角</button>
    <button id="btnShot" class="btn btn-amber">保存截图</button>
  </div>
</aside>

<!-- HUD -->
<div id="hud">
  <span id="hudFps">-- FPS</span>
  <span id="hudRes"></span>
  <span id="hudCam"></span>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 双击复位 · <b>H</b> 隐藏界面 · <b>空格</b> 暂停旋转</div>
<div id="toast" hidden></div>

<script src="js/gl.js"></script>
<script src="js/shaders.js"></script>
<script src="js/stars.js"></script>
<script src="js/camera.js"></script>
<script src="js/main.js"></script>
</body>
</html>
