<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>卡冈图雅 · 黑洞可视化预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7.6' fill='none' stroke='%23ffb347' stroke-width='1.6'/%3E%3Cellipse cx='16' cy='16' rx='15' ry='3.4' fill='%23ffd9a0' opacity='.9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- 3D 视口 -->
  <div id="viewport">
    <canvas id="gl"></canvas>

    <!-- 顶部标题 -->
    <header id="hud">
      <div class="title">
        <h1>GARGANTUA</h1>
        <p>史瓦西 / 克尔黑洞 · 引力透镜 · 吸积盘实时渲染</p>
      </div>
      <div class="badges">
        <span class="badge">WebGL2</span>
        <span class="badge">GR 近似光线步进</span>
        <span class="badge">零依赖</span>
      </div>
    </header>

    <!-- 操作提示 -->
    <div id="hints">
      <span><b>拖拽</b> 旋转视角</span>
      <span><b>滚轮 / 双指</b> 缩放</span>
      <span><b>双击</b> 自动旋转</span>
      <span><b>空格</b> 暂停</span>
      <span><b>H</b> 隐藏界面</span>
      <span><b>S</b> 截图</span>
    </div>

    <!-- 加载 / 错误 -->
    <div id="loading"><div class="spin"></div><p>正在编译着色器…</p></div>
    <div id="error"></div>

    <div id="toast"></div>
  </div>

  <!-- 侧边栏 -->
  <aside id="panel">
    <div class="panel-head">
      <h2>参数控制台</h2>
      <button id="panelToggle" title="折叠 / 展开侧边栏">⟨</button>
    </div>
    <div id="panelBody"></div>
    <footer class="panel-foot">
      <p>参考《星际穿越》卡冈图雅（由 Kip Thorne 指导、
      基于广义相对论的物理渲染）。此处为实时近似实现。</p>
    </footer>
  </aside>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
