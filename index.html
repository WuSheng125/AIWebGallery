<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <meta name="description" content="AI 生成的网页作品及其模型、用时、费用和 Harness 信息。" />
    <title>AI Web测试作品</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23100c08'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23ffb23f' stroke-width='3'/%3E%3Cellipse cx='32' cy='32' rx='25' ry='7' fill='none' stroke='%23ffd27a' stroke-width='2' transform='rotate(-30 32 32)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./gallery.css" />
    <script src="./gallery.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#works-grid">跳到作品</a>
    <header class="site-header">
      <div class="header-inner">
        <h1><span class="brand-mark" aria-hidden="true"></span>AI Web测试作品</h1>
        <p id="collection-count" class="collection-count" aria-live="polite"></p>
      </div>
    </header>
    <div class="site-shell">
      <main id="main" tabindex="-1">
        <section class="intro" aria-labelledby="prompt-title">
          <div class="prompt-panel">
            <h2 id="prompt-title">提示词</h2>
            <blockquote class="prompt-text"><p>在当前目录下，使用web技术制作一个图形化预览黑洞效果的网页，要求外观和样式要类似于电影《星际穿越》里面的黑洞卡冈图雅。黑洞背景要有其他星星，黑洞要有跟电影里类似的吸积盘效果和引力透镜效应。用户可以用鼠标旋转观察，并且在侧边栏可以调整相关参数体现不同参数黑洞的不同效果。你可以使用你认为必要的技术来实现这个网页，既要保证性能也要完成必要的效果。可以引入你觉得必要的第三方图形库比如three.js等等之类。</p></blockquote>
            <p class="test-disclaimer">娱乐测试，结果仅代表当时测试环境下模型的单次表现</p>
          </div>
        </section>
        <div id="gallery-status" class="gallery-status" role="status">正在读取作品…</div>
        <div id="works-grid" class="works-grid" tabindex="-1"></div>
      </main>
    </div>
    <noscript><p class="noscript-notice">请启用 JavaScript 以读取作品目录。</p></noscript>
  </body>
</html>
