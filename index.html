    <a class="skip-link" href="#works-grid">跳到作品</a>

      <div class="header-inner">
        <h1><span class="brand-mark" aria-hidden="true"></span>AI Web测试作品</h1>
        <div class="header-actions">
          <p id="collection-count" class="collection-count" aria-live="polite"></p>
          <a class="github-link" href="https://github.com/WuSheng125/AIWebGallery" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库（新标签页）" title="GitHub 仓库">
            <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true" focusable="false">

    </header>
    <div class="site-shell">
      <main id="main" tabindex="-1">
        <section class="intro" aria-labelledby="prompt-title">
          <div class="prompt-panel">
            <h2 id="prompt-title">提示词</h2>
            <blockquote class="prompt-text"><p>在当前目录下，使用web技术制作一个图形化预览黑洞效果的网页，要求外观和样式要类似于电影《星际穿越》里面的黑洞卡冈图雅。黑洞背景要有其他星星，黑洞要有跟电影里类似的吸积盘效果和引力透镜效应。用户可以用鼠标旋转观察，并且在侧边栏可以调整相关参数体现不同参数黑洞的不同效果。你可以使用你认为必要的技术来实现这个网页，既要保证性能也要完成必要的效果。可以引入你觉得必要的第三方图形库比如three.js等等之类。</p></blockquote>
            <p class="test-disclaimer">娱乐测试，结果仅代表当时测试环境下模型的单次表现</p>
          </div>
        </section>
        <div id="gallery-status" class="gallery-status" role="status">正在读取作品…</div>
        <div id="works-grid" class="works-grid" tabindex="-1"></div>
      </main>
    </div>
    <noscript><p class="noscript-notice">请启用 JavaScript 以读取作品目录。</p></noscript>
  </body>
