    <title>卡冈图雅 · Gargantua</title>

    <div id="scene" aria-label="卡冈图雅黑洞交互式三维场景"></div>

        </p>
      </div>

      <div class="noscript-notice">此模拟需要 JavaScript。请启用 JavaScript 后重新载入页面。</div>
